<!doctype html>
<meta charset="utf-8">
<title>Local mindmap test fixture</title>
<svg width="700" height="300">
  <g class="node" data-node-id="root" role="treeitem" aria-level="1" transform="translate(10,30)">
    <text>Token MindMap</text>
  </g>
  <g class="node" data-node-id="child" role="treeitem" aria-level="2" transform="translate(200,60)">
    <text>User's &quot;tokens&quot;</text>
  </g>
</svg>
<div class="chat-message-response">Old response that must never be reused</div>
<script>
document.querySelectorAll('g.node').forEach(node => {
  node.addEventListener('click', () => {
    if (window.suppressResponse) return;
    const indicator = document.createElement('div');
    indicator.className = 'streaming-indicator';
    indicator.textContent = 'Generating';
    document.body.append(indicator);
    setTimeout(() => {
      const response = document.createElement('div');
      response.className = 'chat-message-response';
      response.textContent = 'Grounded response for ' + node.textContent.trim();
      document.body.append(response);
      setTimeout(() => {
        response.textContent += ': complete.';
        indicator.remove();
      }, 300);
    }, 200);
  });
});
</script>
