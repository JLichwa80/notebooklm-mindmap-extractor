name: Publish

# Uses Trusted Publishing (OIDC) — no API tokens or secrets are stored in the repo.
#
#   * Run manually (Actions tab -> "Publish" -> "Run workflow")  -> TestPyPI dry run
#   * Publish a GitHub Release                                    -> real PyPI
#
# One-time setup — add a "pending publisher" for EACH index, plus a matching
# GitHub Environment (repo Settings -> Environments) of the same name:
#
#   PyPI     https://pypi.org/manage/account/publishing/       environment: pypi
#   TestPyPI https://test.pypi.org/manage/account/publishing/  environment: testpypi
#
# For both, the publisher fields are:
#   Owner: JLichwa80   Repository: notebooklm-mindmap-extractor
#   Workflow name: publish.yml

on:
  release:
    types: [published]
  workflow_dispatch: {}   # manual TestPyPI dry run

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Validate metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    name: Publish to TestPyPI
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write        # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true   # re-runs of the same version won't fail

  pypi:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
